<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Temple Runner</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%}
  .screen{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:rgba(0,0,0,.65)}
  #over{display:none}
  h1{font-size:42px;margin:0 0 10px;color:#ffcc00}
  h2{margin:6px 0}
  p{font-size:18px;margin:6px 20px}
  button{font-size:24px;padding:14px 40px;margin-top:20px;border:none;border-radius:12px;background:#ffcc00;color:#222;font-weight:bold}
  #hud{position:absolute;top:10px;left:0;right:0;display:none;justify-content:space-between;padding:0 16px;color:#fff;font-size:22px;font-weight:bold;text-shadow:0 2px 4px #000;pointer-events:none}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
  <span>Score: <span id="score">0</span></span>
  <span>Coins: <span id="coins">0</span></span>
</div>

<div id="start" class="screen">
  <h1>Temple Runner</h1>
  <p>Swipe left / right to change lane</p>
  <p>Swipe up or tap to jump</p>
  <p>Jump over logs, dodge stone walls, collect coins!</p>
  <button onclick="startGame()">Start</button>
</div>

<div id="over" class="screen">
  <h1>Game Over</h1>
  <h2>Score: <span id="fscore">0</span></h2>
  <h2>Coins: <span id="fcoins">0</span></h2>
  <p>Best: <span id="best">0</span></p>
  <button onclick="startGame()">Play Again</button>
</div>

<script>
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W, H, cx, horizon, groundY, laneW;

var state = "start";
var objs = [], distance = 0, coins = 0, speed = 0.7;
var spawnT = 1, off = 0, run = 0, best = 0;
var player = { lane: 0, lx: 0, jh: 0, jv: 0, air: false };

try { best = +localStorage.getItem("trbest") || 0; } catch (e) {}

function resize() {
  canvas.width = W = window.innerWidth;
  canvas.height = H = window.innerHeight;
  cx = W / 2;
  horizon = H * 0.32;
  groundY = H * 0.86;
  laneW = W * 0.3;
}
resize();
window.addEventListener("resize", resize);

function px(lane, z) { return cx + lane * laneW * z; }
function py(z) { return horizon + (groundY - horizon) * z; }

/* ---------- Controls ---------- */
function move(d) { player.lane = Math.max(-1, Math.min(1, player.lane + d)); }
function jump() {
  if (!player.air) { player.air = true; player.jv = H * 1.1; }
}

var sx = 0, sy = 0, tracking = false;
window.addEventListener("pointerdown", function (e) {
  if (state !== "play") return;
  sx = e.clientX; sy = e.clientY; tracking = true;
});
window.addEventListener("pointermove", function (e) {
  if (!tracking) return;
  var dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) { move(dx > 0 ? 1 : -1); tracking = false; }
  else if (dy < -30) { jump(); tracking = false; }
});
window.addEventListener("pointerup", function () {
  if (tracking) jump();
  tracking = false;
});
window.addEventListener("keydown", function (e) {
  if (state !== "play") return;
  if (e.key === "ArrowLeft") move(-1);
  if (e.key === "ArrowRight") move(1);
  if (e.key === "ArrowUp" || e.key === " ") jump();
});

/* ---------- Game flow ---------- */
function startGame() {
  objs = []; distance = 0; coins = 0; speed = 0.7; spawnT = 1;
  player.lane = 0; player.lx = 0; player.jh = 0; player.jv = 0; player.air = false;
  document.getElementById("start").style.display = "none";
  document.getElementById("over").style.display = "none";
  document.getElementById("hud").style.display = "flex";
  state = "play";
}

function endGame() {
  state = "over";
  var score = Math.floor(distance) + coins * 10;
  if (score > best) {
    best = score;
    try { localStorage.setItem("trbest", best); } catch (e) {}
  }
  document.getElementById("fscore").innerText = score;
  document.getElementById("fcoins").innerText = coins;
  document.getElementById("best").innerText = best;
  document.getElementById("hud").style.display = "none";
  document.getElementById("over").style.display = "flex";
}

/* ---------- Spawning ---------- */
var U0 = Math.log(0.27); // far start position

function spawn() {
  var lane = Math.floor(Math.random() * 3) - 1;
  var r = Math.random();
  if (r < 0.4) objs.push({ type: "low", lane: lane, u: U0 });
  else if (r < 0.7) objs.push({ type: "tall", lane: lane, u: U0 });
  else {
    for (var i = 0; i < 5; i++) objs.push({ type: "coin", lane: lane, u: U0 - i * 0.1 });
  }
}

/* ---------- Update ---------- */
function update(dt) {
  speed = Math.min(1.8, 0.7 + distance * 0.0005);
  distance += speed * dt * 20;
  off += speed * dt * 4;
  run += speed * dt * 12;

  // lane smoothing
  player.lx += (player.lane - player.lx) * Math.min(1, dt * 14);

  // jumping
  if (player.air) {
    player.jh += player.jv * dt;
    player.jv -= H * 3.2 * dt;
    if (player.jh <= 0) { player.jh = 0; player.jv = 0; player.air = false; }
  }

  // spawn
  spawnT -= dt;
  if (spawnT <= 0) {
    spawn();
    spawnT = (0.8 + Math.random() * 0.8) / speed;
  }

  // move + collide
  for (var i = objs.length - 1; i >= 0; i--) {
    var o = objs[i];
    o.u += speed * dt;
    if (o.u > 0.4) { objs.splice(i, 1); continue; }
    if (o.u > 0.0862 && o.u < 0.1906 && Math.abs(o.lane - player.lx) < 0.55) {
      if (o.type === "coin") {
        coins++;
        objs.splice(i, 1);
      } else if (o.type === "tall") {
        endGame(); return;
      } else if (o.type === "low" && player.jh < W * 0.06) {
        endGame(); return;
      }
    }
  }

  document.getElementById("score").innerText = Math.floor(distance) + coins * 10;
  document.getElementById("coins").innerText = coins;
}

/* ---------- Drawing ---------- */
function drawTree(x, y, z) {
  var tw = W * 0.03 * z, th = W * 0.12 * z;
  ctx.fillStyle = "#4a2f1a";
  ctx.fillRect(x - tw / 2, y - th, tw, th);
  ctx.fillStyle = "#0f3d1c";
  ctx.beginPath();
  ctx.arc(x, y - th, W * 0.09 * z, 0, 7);
  ctx.fill();
}

function drawObj(o) {
  var z = Math.exp(o.u) - 0.25;
  if (z < 0.01) return;
  var x = px(o.lane, z), y = py(z);
  if (o.type === "low") {
    var w = W * 0.24 * z, h = W * 0.07 * z;
    ctx.fillStyle = "#8b5a2b"; ctx.fillRect(x - w / 2, y - h, w, h);
    ctx.fillStyle = "#b07a3e"; ctx.fillRect(x - w / 2, y - h, w, h * 0.3);
  } else if (o.type === "tall") {
    var w2 = W * 0.22 * z, h2 = W * 0.3 * z;
    ctx.fillStyle = "#777"; ctx.fillRect(x - w2 / 2, y - h2, w2, h2);
    ctx.fillStyle = "#555";
    for (var k = 1; k < 4; k++) ctx.fillRect(x - w2 / 2, y - h2 + (h2 / 4) * k, w2, Math.max(1, 3 * z));
  } else {
    var r = W * 0.035 * z;
    ctx.fillStyle = "#ffd700";
    ctx.beginPath(); ctx.arc(x, y - W * 0.07 * z, r, 0, 7); ctx.fill();
    ctx.strokeStyle = "#b8860b"; ctx.lineWidth = Math.max(1, 3 * z); ctx.stroke();
  }
}

function drawPlayer() {
  var z = 0.9;
  var x = px(player.lx, z), gy = py(z), y = gy - player.jh;
  var s = W * 0.1 * z;
  // shadow
  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.beginPath(); ctx.ellipse(x, gy, s * 0.5, s * 0.15, 0, 0, 7); ctx.fill();

  var sw = player.air ? 0 : Math.sin(run) * s * 0.3;
  ctx.lineCap = "round";
  // legs
  ctx.strokeStyle = "#2b4c9b"; ctx.lineWidth = s * 0.22;
  ctx.beginPath(); ctx.moveTo(x - s * 0.15, y - s * 0.8); ctx.lineTo(x - s * 0.15 + sw, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + s * 0.15, y - s * 0.8); ctx.lineTo(x + s * 0.15 - sw, y); ctx.stroke();
  // arms
  ctx.strokeStyle = "#f1c27d"; ctx.lineWidth = s * 0.16;
  ctx.beginPath(); ctx.moveTo(x - s * 0.32, y - s * 1.45); ctx.lineTo(x - s * 0.32 - sw * 0.8, y - s * 0.95); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + s * 0.32, y - s * 1.45); ctx.lineTo(x + s * 0.32 + sw * 0.8, y - s * 0.95); ctx.stroke();
  // body
  ctx.fillStyle = "#d9822b";
  ctx.fillRect(x - s * 0.3, y - s * 1.6, s * 0.6, s * 0.85);
  // head
  ctx.fillStyle = "#f1c27d";
  ctx.beginPath(); ctx.arc(x, y - s * 1.9, s * 0.28, 0, 7); ctx.fill();
  ctx.fillStyle = "#222";
  ctx.beginPath(); ctx.arc(x, y - s * 2.0, s * 0.28, Math.PI, 0); ctx.fill();
}

function render() {
  // sky
  var g = ctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, "#1b2a49"); g.addColorStop(1, "#ff8c42");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, horizon + 1);

  // jungle ground
  ctx.fillStyle = "#1f5c2e"; ctx.fillRect(0, horizon, W, H - horizon);

  // road
  var zb = 1.4;
  ctx.fillStyle = "#7a5a3a";
  ctx.beginPath();
  ctx.moveTo(cx, horizon);
  ctx.lineTo(px(1.5, zb), py(zb));
  ctx.lineTo(px(-1.5, zb), py(zb));
  ctx.closePath(); ctx.fill();

  // lane lines
  ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,.25)";
  [-0.5, 0.5].forEach(function (l) {
    ctx.beginPath(); ctx.moveTo(px(l, 0), py(0)); ctx.lineTo(px(l, zb), py(zb)); ctx.stroke();
  });
  ctx.lineWidth = 4; ctx.strokeStyle = "#e0b25c";
  [-1.5, 1.5].forEach(function (l) {
    ctx.beginPath(); ctx.moveTo(px(l, 0), py(0)); ctx.lineTo(px(l, zb), py(zb)); ctx.stroke();
  });

  // moving stripes + trees
  var N = 10;
  for (var i = 0; i < N; i++) {
    var t = ((i + off) % N) / N;
    var z = t * t * 1.4;
    if (z < 0.02) continue;
    ctx.strokeStyle = "rgba(0,0,0,0.22)"; ctx.lineWidth = 1 + 4 * z;
    ctx.beginPath(); ctx.moveTo(px(-1.5, z), py(z)); ctx.lineTo(px(1.5, z), py(z)); ctx.stroke();
    var side = (i % 2 === 0) ? -1 : 1;
    drawTree(px(side * 2.0, z), py(z), z);
  }

  // objects (far to near)
  objs.sort(function (a, b) { return a.u - b.u; });
  for (var j = 0; j < objs.length; j++) drawObj(objs[j]);

  drawPlayer();
}

/* ---------- Main loop ---------- */
var last = 0;
function loop(ts) {
  var dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts;
  if (state === "play") update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

</body>
</html>
