!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S. Santhosh</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      text-align: center;
    }
    .card {
      background: rgba(255,255,255,0.15);
      padding: 30px;
      border-radius: 16px;
    }
    h1 { margin: 0 0 10px; }
    p { font-size: 20px; margin: 6px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello World</h1>
    <p>I am S. Santhosh</p>
    <p>My age is: 19</p>
  </div>
</body>
</html>
