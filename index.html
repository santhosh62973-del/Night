<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lane Runner</title>
<style>
:root{--bg:#0f172a;--fg:#f8fafc;--accent:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
#screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(15,23,42,.92);text-align:center;padding:20px}
#screen h1{font-size:2.2rem}
#screen p{opacity:.8}
button{font-size:1.3rem;padding:12px 36px;border:0;border-radius:12px;background:var(--accent);color:#052e16;font-weight:700}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:10px 16px;font-size:1.2rem;font-weight:700;display:flex;justify-content:space-between}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="sc">Score: 0</span><span id="hi">Best: 0</span></div>
<div id="screen">
  <h1 id="title">Lane Runner</h1>
  <p id="msg">Tap left or right side of the screen to change lane. Avoid the red blocks!</p>
  <button id="btn">START</button>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const screen=document.getElementById('screen'),title=document.getElementById('title'),
msg=document.getElementById('msg'),btn=document.getElementById('btn'),
sc=document.getElementById('sc'),hi=document.getElementById('hi');
let W,H,lane=1,tx=0,obs=[],score=0,best=0,speed=5,frame=0,running=false;
try{best=+localStorage.getItem('best')||0}catch(e){}
hi.textContent='Best: '+best;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
addEventListener('resize',resize);resize();
function laneX(l){return W/3*l+W/6}
function start(){lane=1;obs=[];score=0;speed=5;frame=0;running=true;screen.style.display='none';tx=laneX(1)}
function end(){
  running=false;
  if(score>best){best=score;try{localStorage.setItem('best',best)}catch(e){}}
  hi.textContent='Best: '+best;
  title.textContent='Game Over';
  msg.textContent='Your score: '+score;
  btn.textContent='PLAY AGAIN';
  screen.style.display='flex';
}
btn.onclick=start;
function move(d){if(!running)return;lane=Math.max(0,Math.min(2,lane+d))}
addEventListener('pointerdown',e=>{if(e.target===btn)return;move(e.clientX<W/2?-1:1)});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
function loop(){
  x.fillStyle='#0f172a';x.fillRect(0,0,W,H);
  x.strokeStyle='#334155';x.lineWidth=3;x.setLineDash([20,20]);x.lineDashOffset=-frame*speed%40;
  for(let i=1;i<3;i++){x.beginPath();x.moveTo(W/3*i,0);x.lineTo(W/3*i,H);x.stroke()}
  x.setLineDash([]);
  const pw=Math.min(W/3*0.5,70),py=H-130;
  tx+=(laneX(lane)-tx)*0.25;
  if(running){
    frame++;
    if(frame%Math.max(25,60-Math.floor(score/50))===0)obs.push({l:Math.floor(Math.random()*3),y:-60});
    speed=5+score/80;
    obs.forEach(o=>o.y+=speed);
    for(const o of obs){
      if(o.l===lane&&o.y+50>py&&o.y<py+pw){end();break}
    }
    obs=obs.filter(o=>{if(o.y>H){score+=10;return false}return true});
    sc.textContent='Score: '+score;
  }
  x.fillStyle='#ef4444';
  obs.forEach(o=>x.fillRect(laneX(o.l)-pw/2,o.y,pw,50));
  x.fillStyle='#22c55e';
  x.fillRect(tx-pw/2,py,pw,pw);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
