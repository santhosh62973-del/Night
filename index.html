<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Father’s Legend</title>
<style>
:root{--bg:#0b0d14;--card:#151a28;--gold:#e8b84a;--text:#f1ece0;--dim:#9aa1b5;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif}
body{display:flex;justify-content:center;background:radial-gradient(circle at 50% 0%,#1d2540,var(--bg) 60%)}
#app{width:100%;max-width:480px;min-height:100%;padding:20px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.screen{display:none;animation:fade .8s ease}
.screen.on{display:block}
#s-front.on{display:flex;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:flex-end;padding:24px 24px calc(48px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#0000 35%,#000d 100%),url(front.jpg) center top/cover no-repeat,var(--bg);text-shadow:0 2px 12px #000}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.photo{width:190px;height:190px;border-radius:50%;margin:0 auto 20px;border:3px solid var(--gold);box-shadow:0 0 40px #e8b84a55;object-fit:cover;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:64px;overflow:hidden}
.photo.sm{width:110px;height:110px;font-size:40px;margin-bottom:14px}
h1{font-size:30px;color:var(--gold);letter-spacing:1px;margin-bottom:8px}
h2{font-size:20px;color:var(--gold);margin-bottom:14px}
.sub{color:var(--dim);font-style:italic;margin-bottom:26px}
button,input{font:inherit}
.btn{background:var(--gold);color:#1a1405;border:0;border-radius:30px;padding:14px 34px;font-weight:bold;font-size:17px;cursor:pointer;margin:6px}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);font-size:14px;padding:8px 18px}
input[type=text]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--gold);background:var(--card);color:var(--text);font-size:18px;text-align:center;margin-bottom:16px}
.box{background:var(--card);border:1px solid #2a3150;border-radius:16px;padding:22px;min-height:210px;text-align:left;line-height:1.7;font-size:18px}
.prog{height:4px;background:#222a44;border-radius:4px;margin:0 0 16px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .5s}
.hint{color:var(--dim);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div id="app">

<!-- 1. FRONT SCREEN -->
<section class="screen on" id="s-front">
  <h1 id="gameTitle"></h1>
  <p class="sub">A story of courage, told for the one who came after.</p>
  <button class="btn" id="start">Begin</button><br>
  <button class="btn ghost" id="pick">Choose father’s photo</button>
  <input type="file" id="file" accept="image/*" hidden>
</section>

<!-- 2. NAME -->
<section class="screen" id="s-name">
  <h2>Before we begin…</h2>
  <p class="sub">What is your name, traveller?</p>
  <input type="text" id="nameIn" maxlength="20" placeholder="Enter your name" autocomplete="off">
  <button class="btn" id="nameGo">Continue</button>
</section>

<!-- 3. STORY -->
<section class="screen" id="s-story">
  <div class="photo sm" id="photo2">⚔️</div>
  <div class="prog"><i id="bar"></i></div>
  <h2 id="chTitle"></h2>
  <div class="box" id="chText"></div>
  <p class="hint">Tap the button to continue</p>
  <button class="btn" id="next">Next</button>
</section>

<!-- 4. END -->
<section class="screen" id="s-end">
  <div class="photo sm" id="photo3">⚔️</div>
  <h2 id="endTitle"></h2>
  <div class="box" id="endText"></div><br>
  <button class="btn" id="again">Play again</button>
</section>

</div>

<script>
/* ============ EDIT ONLY THIS PART ============ */
const CONFIG = {
  gameTitle: "My Father’s Legend",
  fatherName: "Appa",
  photo: "father.jpg",   // upload your image to the same repo with this exact name
  inspiration: "the great warriors of old",
  intro: "Long ago, in a land of red earth and tall banyan trees, a man was born who would never bow to fear. They called him {father}. This is his story, {name}, and one day it will be yours too.",
  chapters: [
    {t:"The Boy of the Village", x:"{father} grew up with little, but his heart was full. He listened to stories of {inspiration} and promised himself he would be brave like them."},
    {t:"The First Trial", x:"Hard days came. Hunger, doubt and tired hands tried to stop him. But {father} stood up every single time, because giving up was never his way."},
    {t:"The Fire Within", x:"Like {inspiration}, he fought his own great battles: for his family, for honour, for tomorrow. Every scar on his hands became a lesson."},
    {t:"The Victory", x:"He won, not with a sword, but with patience and sacrifice. Everything he built, he built so that you, {name}, could stand taller than he did."},
    {t:"The Gift", x:"His greatest treasure was never gold. It was courage, handed down from father to child. Now it is in your hands, {name}."}
  ],
  endTitle: "The Legend Continues",
  ending: "{name}, you carry {father}’s strength in your name and in your heart. Walk bravely. The next chapter is yours to write."
};
/* ============================================ */

const $ = id => document.getElementById(id);
let name = "Traveller", idx = -1, timer = null;
const fill = s => s.replace(/{name}/g, name).replace(/{father}/g, CONFIG.fatherName).replace(/{inspiration}/g, CONFIG.inspiration);

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  $(id).classList.add('on');
}

function setPhoto(src){
  ['photo2','photo3'].forEach(id => {
    $(id).innerHTML = '<img src="' + src + '" alt="" style="width:100%;height:100%;object-fit:cover">';
  });
}
function tryPhoto(){
  const im = new Image();
  im.onload = () => setPhoto(CONFIG.photo);
  im.src = CONFIG.photo;
}

function type(el, text, done){
  clearInterval(timer);
  let i = 0; el.textContent = "";
  timer = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= text.length){ clearInterval(timer); timer = null; if (done) done(); }
  }, 28);
  el.onclick = () => { if (timer){ clearInterval(timer); timer = null; el.textContent = text; if (done) done(); } };
}

function chapter(){
  const c = CONFIG.chapters[idx];
  $('chTitle').textContent = (idx + 1) + ". " + c.t;
  $('bar').style.width = ((idx + 1) / CONFIG.chapters.length * 100) + "%";
  $('next').textContent = idx === CONFIG.chapters.length - 1 ? "Finish" : "Next";
  type($('chText'), fill(c.x));
}

$('gameTitle').textContent = CONFIG.gameTitle;
document.title = CONFIG.gameTitle;
tryPhoto();

$('pick').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => setPhoto(r.result); r.readAsDataURL(f);
};

$('start').onclick = () => {
  let saved = ""; try { saved = localStorage.getItem('fg_name') || ""; } catch(e){}
  $('nameIn').value = saved; show('s-name');
};

$('nameGo').onclick = () => {
  const v = $('nameIn').value.trim();
  if (!v){ $('nameIn').focus(); return; }
  name = v; try { localStorage.setItem('fg_name', v); } catch(e){}
  idx = -1; show('s-story');
  $('chTitle').textContent = "Prologue";
  $('bar').style.width = "0";
  $('next').textContent = "Next";
  type($('chText'), fill(CONFIG.intro));
};
$('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('nameGo').click(); });

$('next').onclick = () => {
  if (timer){ $('chText').click(); return; }
  idx++;
  if (idx >= CONFIG.chapters.length){
    show('s-end');
    $('endTitle').textContent = CONFIG.endTitle;
    type($('endText'), fill(CONFIG.ending));
    return;
  }
  chapter();
};

$('again').onclick = () => { idx = -1; show('s-front'); };
</script>
</body>
</html>
